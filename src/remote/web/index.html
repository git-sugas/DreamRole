<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DreamRole</title>
  <link rel="stylesheet" href="/m/static/style.css">
</head>
<body>

<!-- ========== 登录视图 ========== -->
<div id="view-login" class="view active">
  <div class="login-card">
    <div class="logo">DreamRole</div>
    <div class="sub">手机端联动 · 请输入 PC 端显示的 6 位配对码</div>
    <input id="pair-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <button id="login-btn" class="primary" style="width:100%">连接</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- ========== 会话列表视图 ========== -->
<div id="view-sessions" class="view">
  <div class="header">
    <h1>DreamRole</h1>
    <button class="ghost" id="logout-btn">退出登录</button>
  </div>
  <div class="session-list" id="session-list"></div>
</div>

<!-- ========== 聊天视图 ========== -->
<div id="view-chat">
  <div class="chat-header">
    <button class="back" id="back-btn">‹</button>
    <div class="title">
      <div id="chat-title">会话</div>
      <div class="sub" id="chat-sub"></div>
    </div>
  </div>

  <!-- 群聊手动模式选角条 -->
  <div class="speaker-bar" id="speaker-bar">
    <span class="label">由谁回复：</span>
    <div id="speaker-chips" style="display:flex;gap:10px;"></div>
  </div>

  <div class="msg-list" id="msg-list"></div>

  <div class="input-bar">
    <textarea id="msg-input" placeholder="输入消息…" rows="1"></textarea>
    <button class="send-btn primary" id="send-btn">发送</button>
  </div>
</div>

<div class="status-overlay" id="status-overlay"></div>
<div class="toast" id="toast"></div>

<!-- 长按消息上下文菜单 -->
<div class="ctx-mask" id="ctx-mask"></div>
<div class="ctx-menu" id="ctx-menu" style="display:none"></div>

<script src="/m/static/marked.min.js"></script>
<script src="/m/static/render.js"></script>
<script src="/m/static/app.js"></script>
</body>
</html>
